[project]
name = "trueup"
version = "0.0.1"
description = "Finds where AI agent traces disagree with what really happened."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "neatlogs>=1.4.26",
    "openai>=3.28.0",
]

[project.scripts]
trueup = "trueup.cli:main"

[dependency-groups]
dev = [
    "anthropic>=1.13.0",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "openai>=3.28.0",
    "openai-agents>=0.23.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trueup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = ["e2e: runs subprocesses in per-library venvs (uv run pytest -m e2e)"]
