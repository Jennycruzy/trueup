name: ci

on: [push]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run trueup verify
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        library: [neatlogs, openinference, openllmetry]
    env:
      TRUEUP_E2E_LIBRARY: ${{ matrix.library }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q -m e2e
